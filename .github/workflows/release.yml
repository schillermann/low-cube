name: Release

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            pkg-config \
            libwayland-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release -p client

      - name: Prepare executable
        run: |
          mkdir -p dist
          cp target/release/client dist/low-cube-linux
          chmod +x dist/low-cube-linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: low-cube-linux
          path: dist/low-cube-linux

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release -p client

      - name: Prepare executable
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/client.exe dist/low-cube-windows.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: low-cube-windows
          path: dist/low-cube-windows.exe

  publish:
    name: Publish Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux executable
        uses: actions/download-artifact@v4
        with:
          name: low-cube-linux
          path: dist

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: low-cube-windows
          path: dist

      - name: Ensure executable permission
        run: chmod +x dist/low-cube-linux

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Low-Cube Latest Build' }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            dist/low-cube-linux
            dist/low-cube-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
