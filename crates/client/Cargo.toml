[package]
name = "client"
version = "0.73.0"
edition = "2021"

[dependencies]
acoustics = { path = "../acoustics" }
world = { path = "../world" }
engine = { path = "../engine" }
fauna = { path = "../fauna" }
sanctuary = { path = "../sanctuary" }
glam = "0.29"
glow = "0.16"
glutin = "0.32"
glutin-winit = "0.5"
winit = { version = "0.30", features = ["rwh_06"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
smithay-clipboard = "0.7"
