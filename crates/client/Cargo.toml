[package]
name = "client"
version = "0.136.0"
edition = "2021"

[dependencies]
acoustics = { path = "../acoustics" }
world = { path = "../world" }
engine = { path = "../engine" }
sanctuary = { path = "../sanctuary" }
glam = "0.29"
wgpu = { version = "24", default-features = false, features = ["wgsl", "dx12"] }
pollster = "1.0"
winit = { version = "0.30", features = ["rwh_06"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
smithay-clipboard = "0.7"
