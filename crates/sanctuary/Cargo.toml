[package]
name = "sanctuary"
version = "0.66.0"
edition = "2024"

[lib]
name = "sanctuary"
path = "src/lib.rs"

[[bin]]
name = "sanctuary"
path = "src/main.rs"

[dependencies]
world = { path = "../world" }
glam = "0.29"
x25519-dalek = { version = "2", default-features = false, features = ["alloc", "static_secrets"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "std"] }
getrandom = "0.3"
