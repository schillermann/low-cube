[workspace]
members = [
    "crates/world",
    "crates/engine",
    "crates/sanctuary",
    "crates/acoustics",
    "crates/fauna",
    "crates/client",
]
resolver = "2"

[profile.dev]
debug = false
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.test]
debug = false
incremental = true

[profile.test.package."*"]
opt-level = 1
