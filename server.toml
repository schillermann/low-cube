# Low-Cube Game & Dedicated Server Configuration

[server]
# UDP port for the dedicated server (`low-cube-server`, default: 27777).
port = 27777

[storage]
# Optional binary write-ahead chronicle file for persistent dedicated servers (e.g. "sanctuary.wal").
# Leave empty ("") for in-memory ephemeral sessions; override via LOW_CUBE_JOURNAL or --journal.
journal = ""

[physics]
# Planetary gravity (default: 10 for Earth gravity).
# Jump height derives automatically from gravity:
# - gravity = 10 : Standard Earth gravity (jump height ~0.5m, clears 50cm slabs)
# - gravity = 5  : Low gravity (jump height ~1.0m, clears full 1-meter blocks)
# - gravity = 2  : Moon gravity (jump height ~2.5m, long floaty leaps)
# - gravity = 20 : High gravity (jump height ~0.25m, heavy steps)
gravity = 10

[world]
# World-Cube edge multiple (integer 1..=32; 1 = 128 blocks, 8 = 1024 blocks, 32 = 4096 blocks = 100.7 km² Earth).
# Governs Earth as well as astronomical planet, moon, Sun, and landable belt-asteroid dimensions (capped so the
# 3.20 AU outer Asteroid Belt remains reachable in under 1 hour by Epstein-Drive).
size = 1

# Day/night cycle rotation in minutes (default: 20 min).
# Set to 0 to freeze the sun at permanent noon.
cycle = 20

[cosmos]
# Procedural Mars-Jupiter Asteroid Belt (2.20..3.20 AU) occupancy density (0.0..=8.0, default: 1.0).
# Override via LOW_CUBE_ASTEROID_DENSITY or --asteroid-density.
asteroid_density = 1.0

[aurora]
# Nocturnal polar lights over Arctic.
# Supported modes:
# - "nightly"  : Active every night (default baseline)
# - "off"      : Permanently disabled; starry night sky remains active without aurora curtains
# - "rare"     : Appears rarely (~1 in 5 nights)
# - "normal"   : Appears regularly (~every 2nd night)
# - "frequent" : Appears frequently (~4 in 5 nights)
mode = "nightly"

[inventory]
# Starting items stowed in the player's satchel upon entering the world.
# Format: comma-separated item names with optional ":count" (or "none" for an empty satchel).
# Supported items:
#   rig_wrench, suit_radio, cantilever_crane, field_camera, laser_beacon, vehicle_blueprint,
#   rocket_camera, flight_console, rocket_nozzle, fusion_torch, titanium_hull, carbon_silicate,
#   black_box_pod, vitrified_basalt, aircraft_engine, steering_wheel, car_wheel, cabin_seat,
#   pedal_cluster, spawn_stone, quarried_stone, excavated_earth, timber_block, plank_block,
#   crust_block, copper_ore, iron_ore, gold_ore, titanium_billet
items = "cantilever_crane, field_camera, vehicle_blueprint, rocket_camera:4, flight_console, rocket_nozzle:6, aircraft_engine, steering_wheel, car_wheel:8, cabin_seat:2, pedal_cluster:2"

